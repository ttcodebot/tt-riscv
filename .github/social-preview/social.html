<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1280px; height: 640px; background: #191919; overflow: hidden; }
  svg { display: block; }
  .title { font-family: 'Lato'; font-weight: 900; fill: #ffffff; font-size: 88px; }
  .sub { font-family: 'Lato'; font-weight: 700; fill: #8afbfd; font-size: 31px; }
  .asm { font-family: 'DejaVu Sans Mono'; font-size: 17px; fill: #2c2c2c; }
  .term { font-family: 'DejaVu Sans Mono'; font-size: 19px; fill: #8afbfd; }
  .core { font-family: 'DejaVu Sans Mono'; font-weight: 700; font-size: 25px; fill: #191919; letter-spacing: 1px; }
</style>
</head>
<body>
<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="640" fill="#191919"/>
  <rect width="1280" height="92" fill="#fc9f9f"/>
  <rect y="549" width="1280" height="91" fill="#fc9f9f"/>

  <!-- faint RISC-V assembly behind the chip: drives the 7-segment display through KianV's GPIO -->
  <g class="asm" id="asm"></g>

  <!-- text -->
  <text class="title" x="78" y="263">RISC-V on</text>
  <text class="title" x="78" y="352">Tiny Tapeout</text>
  <text class="sub" x="82" y="433">Linux, Zephyr, MicroPython and Rust</text>
  <text class="sub" x="82" y="474">on real open-source silicon</text>

  <!-- chip -->
  <g id="pins" fill="#ffffff"></g>
  <rect x="860" y="180" width="280" height="280" rx="34" fill="#ffffff"/>
  <!-- Tiny Tapeout logo (tinytapeout_www/static/ttlogo.svg), cropped to the circle -->
  <svg x="925" y="196" width="150" height="150" viewBox="207 95 268 268">
    <path fill="#fc9f9f" d="M341,96.4c-44.5,0-83.9,21.9-108.1,55.5c-7.9,11-14.2,23.2-18.5,36.4h21.6h52.1v90.1h39.3v-24.3h22.7v87.8
		c-3,0.3-6.1,0.4-9.2,0.4c-62.2,0-112.8-50.6-112.8-112.8c0-10.3,1.4-20.2,4-29.6h-21c-2.2,9.5-3.3,19.4-3.3,29.6
		c0,73.4,59.7,133.1,133.1,133.1c3.1,0,6.1-0.1,9.2-0.3c1.7-0.1,3.4-0.3,5.1-0.5c0.1,0,0.3,0,0.4,0c11.8-1.3,23.1-4.1,33.8-8.3v0
		c0,0,0,0,0,0v-99.4H428v-36.4H327.5v-29.5H366v-36.4H259.3c20.5-21.6,49.6-35.1,81.7-35.1c62.2,0,112.8,50.6,112.8,112.8
		c0,40.1-21,75.4-52.6,95.4v23.4c43.3-22,73-67,73-118.8C474.1,156.1,414.4,96.4,341,96.4z"/>
  </svg>
  <text class="core" x="1000" y="374" text-anchor="middle">RV32IMA</text>
  <rect x="890" y="388" width="220" height="56" rx="9" fill="#111111"/>
  <text class="term" x="904" y="412">/ # uname -m</text>
  <text class="term" x="904" y="434">riscv32</text>
</svg>
<script>
  // 7 pins per side, like the reference card.
  const pins = document.getElementById('pins'), NS = 'http://www.w3.org/2000/svg';
  const add = (x, y, w, h) => { const r = document.createElementNS(NS, 'rect');
    Object.entries({x, y, width: w, height: h, rx: 4}).forEach(([k, v]) => r.setAttribute(k, v)); pins.appendChild(r); };
  for (let i = 0; i < 7; i++) {
    const c = 205 + i * 34.5;            // pin centre along the side
    add(888 + i * 34.5, 138, 14, 34);    // top
    add(888 + i * 34.5, 468, 14, 34);    // bottom
    add(818, c - 7, 34, 14);             // left
    add(1148, c - 7, 34, 14);            // right
  }
  const asm = [
    'lui   a0, 0x10600', 'li    t0, 0xff', 'sw    t0, 0(a0)', 'la    a1, glyphs', 'loop: lbu   t1, 0(a1)',
    'sw    t1, 4(a0)', 'addi  a1, a1, 1', 'bnez  t1, loop', 'sw    zero, 0(a0)', 'li    a7, 93', 'ecall',
    'csrr  t2, mcycle', 'amoadd.w t3, t4, (a2)', 'mul   a3, a4, a5',
  ];
  const g = document.getElementById('asm');
  asm.forEach((line, i) => {
    for (const x of [760, 1150]) {
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', x); t.setAttribute('y', 118 + i * 31); t.textContent = line; g.appendChild(t);
    }
  });
</script>
</body>
</html>
